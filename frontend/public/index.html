<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="World Mission High School Portal" />
    <meta name="theme-color" content="#185fa5" />
    <meta name="google-site-verification" content="o92y1o-ZPdwoBnKjUDGM6MowhPTIr9QfWW6ZoIbsSnY" />
    <link rel="icon" href="%PUBLIC_URL%/logo-512.png?v=6" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo-512.png?v=6" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json?v=6" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="WMHS Portal" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>WMHS Portal</title>
    <style>
      *{box-sizing:border-box;margin:0;padding:0}
      html{-webkit-text-size-adjust:100%}
      body{font-family:'Segoe UI',system-ui,sans-serif;background:#f0f7ff;color:#0f172a}
      #root{min-height:100vh}
      button,input,select,textarea{font-family:inherit}
      :root{--blue:#185fa5;--blue-dark:#0c447c;--safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px)}

      /* ── App shell: desktop = sidebar, mobile = top bar + bottom tabs ── */
      .app-shell{display:flex;min-height:100vh;min-height:100dvh}
      .app-main{flex:1;min-width:0}
      .mobile-only{display:none !important}
      .desktop-only{display:flex}

      /* ── Auth: two equal halves ── */
      .auth-split{display:flex;min-height:100vh;min-height:100dvh;width:100%}
      .auth-left{flex:1 1 50%;background:#185fa5;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px 40px;text-align:center}
      .auth-right{flex:1 1 50%;background:#fff;display:flex;align-items:center;justify-content:center;padding:40px 32px;overflow-y:auto}
      .auth-form-wrap{width:100%;max-width:400px}

      @media print{.desktop-only,.mobile-only,.calendar-fab,button{display:none !important}.app-main{padding:0 !important}body{background:#fff}}

      /* ── Tables / wide content scroll inside their own box, never the whole page ── */
      .table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}

      @media (max-width: 768px) {
        .desktop-only{display:none !important}
        .mobile-only{display:flex !important}

        .app-main{padding-bottom:calc(64px + var(--safe-b))}
        .mobile-topbar{position:sticky;top:0;z-index:100;background:#fff;border-bottom:1px solid #e2e8f0;
          padding:calc(10px + var(--safe-t)) 16px 10px;align-items:center;gap:10px}
        .mobile-tabbar{position:fixed;left:0;right:0;bottom:0;z-index:200;background:#fff;border-top:1px solid #e2e8f0;
          padding:6px 4px calc(6px + var(--safe-b));justify-content:space-around}
        .mobile-tab{flex:1;min-width:0;border:none;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;
          padding:6px 2px;font-size:11px;color:#64748b;cursor:pointer;position:relative;min-height:48px;border-radius:10px}
        .mobile-tab .ico{font-size:21px;line-height:1}
        .mobile-tab.active{color:#185fa5;font-weight:600;background:#e6f1fb}
        .sheet-backdrop{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:300}
        .sheet{position:fixed;left:0;right:0;bottom:0;z-index:310;background:#fff;border-radius:18px 18px 0 0;
          padding:14px 16px calc(16px + var(--safe-b));max-height:80vh;overflow-y:auto}
        .sheet-item{display:flex;align-items:center;gap:14px;width:100%;border:none;background:none;text-align:left;
          padding:14px 8px;font-size:15px;border-radius:10px;cursor:pointer;color:#0f172a;min-height:48px}
        .sheet-item.active{background:#e6f1fb;color:#185fa5;font-weight:600}

        .modal-backdrop{align-items:flex-end !important;padding:0 !important}
        .modal-content{width:100% !important;max-width:none !important;margin:0 !important;border-radius:18px 18px 0 0 !important;
          max-height:92vh !important;overflow-y:auto !important}
        .page-container{padding:16px 14px !important}
        .section-header{flex-direction:column !important;align-items:stretch !important;gap:12px !important}
        .section-action,.section-action button{width:100% !important}
        .calendar-fab{bottom:calc(76px + var(--safe-b)) !important;right:14px !important}
        input,select,textarea{font-size:16px !important}   /* stops iOS zoom-on-focus */
        .grid-auto{grid-template-columns:1fr !important}
        .stat-grid{grid-template-columns:repeat(2,1fr) !important}

        /* Auth on phones: blue top half, white bottom half */
        .auth-split{flex-direction:column}
        .auth-left{flex:0 0 50vh;flex-basis:50dvh;min-height:240px;padding:calc(24px + var(--safe-t)) 20px 20px}
        .auth-right{flex:1 1 auto;align-items:flex-start;padding:28px 20px calc(28px + var(--safe-b));overflow-y:visible}
        .auth-left .auth-title{font-size:20px !important}
        .auth-left .auth-motto{font-size:13px !important}
      }
      @media (max-height:520px) and (max-width:768px){ .auth-left{flex-basis:auto;min-height:0;padding-top:16px;padding-bottom:16px} }
    </style>
  </head>
  <body>
    <noscript>JavaScript is required to run this application.</noscript>
    <div id="root"></div>
  </body>
</html>
